openapi: 3.0.3
info:
  title: Libris API
  version: 0.5.0
paths:
  /api/v1/me:
    get:
      summary: "The reader making the request: their profile and role"
      responses:
        "200":
          description: The reader's identity and role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentReader"
  /api/v1/isbn/{isbn}:
    get:
      summary: "What the public sources know about an ISBN; nothing is stored"
      parameters:
        - name: isbn
          in: path
          required: true
          description: The ISBN-13 as thirteen digits
          schema:
            type: string
            nullable: false
            pattern: "^97[89][0-9]{10}$"
          examples:
            ONE_PIECE_1:
              value: "9782723488525"
            400_NOT_AN_ISBN:
              value: "9782723488526"
            404_UNKNOWN_ISBN:
              value: "9782000000006"
            503_SOURCES_DOWN:
              value: "9791000000008"
      responses:
        "200":
          description: The merged answer of the sources that replied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IsbnLookup"
              examples:
                ONE_PIECE_1:
                  value:
                    isbn13: "9782723488525"
                    kind: MANGA
                    title: "Romance dawn"
                    subtitle: "à l'aube d'une grande aventure"
                    authors:
                      - name: "Eiichirō Oda"
                        role: WRITER
                      - name: "Eiichirō Oda"
                        role: ARTIST
                    series:
                      name: "One piece"
                      volumeNumber: 1
                    collection: "Shonen manga"
                    publisher: "Glénat"
                    publicationYear: 2013
                    language: "fr"
                    pageCount: 203
                    summary: null
                    coverUrl: "https://covers.openlibrary.org/b/isbn/9782723488525-L.jpg"
        "400":
          description: The text is not an ISBN
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                400_NOT_AN_ISBN:
                  value:
                    type: "/problems/validation"
                    title: "Bad Request"
                    status: 400
                    errors:
                      - field: "isbn"
                        code: "not-an-isbn"
        "404":
          description: No source knows this ISBN
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                404_UNKNOWN_ISBN:
                  value:
                    type: "/problems/not-found"
                    title: "Not Found"
                    status: 404
        "503":
          description: No source answered; a 5xx without this body means Libris itself is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                503_SOURCES_DOWN:
                  value:
                    type: "/problems/sources-unavailable"
                    title: "Service Unavailable"
                    status: 503
components:
  schemas:
    CurrentReader:
      type: object
      additionalProperties: false
      required: [id, username, displayName, email, role]
      properties:
        id:
          type: string
          format: uuid
          nullable: false
        username:
          type: string
          nullable: false
          minLength: 1
        displayName:
          type: string
          nullable: false
          minLength: 1
        email:
          type: string
          format: email
          nullable: false
        role:
          type: string
          nullable: false
          enum: [READER, ADMIN]
    IsbnLookup:
      type: object
      additionalProperties: false
      required: [isbn13, kind, title, subtitle, authors, series, collection, publisher,
                 publicationYear, language, pageCount, summary, coverUrl]
      properties:
        isbn13:
          type: string
          nullable: false
          pattern: "^97[89][0-9]{10}$"
        kind:
          type: string
          nullable: false
          enum: [BOOK, BD, MANGA]
        title:
          type: string
          nullable: false
          minLength: 1
        subtitle:
          type: string
          nullable: true
        authors:
          type: array
          nullable: false
          items:
            $ref: "#/components/schemas/Author"
        series:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Series"
        collection:
          type: string
          nullable: true
        publisher:
          type: string
          nullable: true
        publicationYear:
          type: integer
          nullable: true
          minimum: 1
        language:
          type: string
          nullable: true
          description: ISO 639-1 code
          pattern: "^[a-z]{2}$"
        pageCount:
          type: integer
          nullable: true
          minimum: 1
        summary:
          type: string
          nullable: true
        coverUrl:
          type: string
          nullable: true
    Author:
      type: object
      additionalProperties: false
      required: [name, role]
      properties:
        name:
          type: string
          nullable: false
          minLength: 1
        role:
          type: string
          nullable: false
          enum: [WRITER, ARTIST, COLOURIST, TRANSLATOR]
    Series:
      type: object
      additionalProperties: false
      required: [name, volumeNumber]
      properties:
        name:
          type: string
          nullable: false
          minLength: 1
        volumeNumber:
          type: integer
          nullable: true
          minimum: 1
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          nullable: false
          description: A slug under /problems/ the client switches on
        title:
          type: string
          nullable: false
        status:
          type: integer
          nullable: false
        errors:
          type: array
          nullable: false
          minItems: 1
          description: One entry per refused request field, on a validation problem only
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field:
                type: string
                nullable: false
              code:
                type: string
                nullable: false
